<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>AlgoFit Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #080808;
  color: #f5f5f5;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}


/* LOGIN */

.login-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 20px;
}

.login-card {
  width: min(430px, 100%);
  background: #111;
  border: 1px solid #292929;
  border-radius: 24px;
  padding: 35px;
  box-shadow: 0 30px 100px rgba(0,0,0,.5);
}

.logo {
  font-size: 26px;
  font-weight: 900;
  letter-spacing: 4px;
  margin-bottom: 8px;
}

.muted {
  color: #888;
}

.field {
  margin-top: 18px;
}

.field label {
  display: block;
  margin-bottom: 8px;
  color: #aaa;
  font-size: 13px;
}

.field input,
.field textarea,
.field select {
  width: 100%;
  background: #181818;
  border: 1px solid #303030;
  color: white;
  border-radius: 12px;
  padding: 13px;
  outline: none;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: #fff;
}

.primary {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  border: 0;
  border-radius: 12px;
  background: white;
  color: black;
  font-weight: 800;
}

.error {
  margin-top: 15px;
  color: #ff6464;
  font-size: 14px;
}


/* ADMIN */

.admin {
  min-height: 100vh;
}

.topbar {
  height: 72px;
  border-bottom: 1px solid #242424;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 30px;
  background: rgba(8,8,8,.9);
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(15px);
}

.brand {
  font-weight: 900;
  letter-spacing: 4px;
}

.logout {
  background: #171717;
  border: 1px solid #303030;
  color: white;
  border-radius: 10px;
  padding: 9px 14px;
}

.layout {
  display: grid;
  grid-template-columns: 230px 1fr;
  min-height: calc(100vh - 72px);
}

.sidebar {
  border-right: 1px solid #242424;
  padding: 25px 16px;
}

.nav {
  width: 100%;
  background: transparent;
  color: #aaa;
  border: 0;
  text-align: left;
  padding: 13px;
  border-radius: 10px;
  margin-bottom: 5px;
}

.nav.active,
.nav:hover {
  background: #181818;
  color: white;
}

.main {
  padding: 35px;
  max-width: 1400px;
  width: 100%;
  margin: auto;
}

.page-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 30px;
}

.page-head h1 {
  margin: 0;
  font-size: 32px;
}

.add-btn {
  border: 0;
  background: white;
  color: black;
  border-radius: 11px;
  padding: 12px 18px;
  font-weight: 800;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 30px;
}

.stat {
  background: #111;
  border: 1px solid #262626;
  padding: 22px;
  border-radius: 18px;
}

.stat small {
  color: #777;
}

.stat strong {
  display: block;
  font-size: 30px;
  margin-top: 8px;
}


/* PRODUCTS */

.products {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 18px;
}

.product {
  background: #111;
  border: 1px solid #252525;
  border-radius: 18px;
  overflow: hidden;
}

.product-image {
  width: 100%;
  aspect-ratio: 1 / 1.1;
  object-fit: cover;
  display: block;
}

.product-body {
  padding: 17px;
}

.product-body h3 {
  margin: 0 0 7px;
}

.product-price {
  font-weight: 800;
}

.product-category {
  color: #777;
  font-size: 13px;
  margin-top: 5px;
}

.actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}

.actions button {
  flex: 1;
  padding: 9px;
  border-radius: 9px;
  border: 1px solid #303030;
  background: #191919;
  color: white;
}

.actions .delete {
  color: #ff6565;
}


/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal.show {
  display: flex;
}

.modal-box {
  width: min(650px, 100%);
  max-height: 90vh;
  overflow-y: auto;
  background: #111;
  border: 1px solid #303030;
  border-radius: 22px;
  padding: 25px;
}

.modal-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.close {
  background: #1b1b1b;
  border: 0;
  color: white;
  width: 36px;
  height: 36px;
  border-radius: 50%;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.full {
  grid-column: 1 / -1;
}

.checkbox {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  color: #aaa;
}

.empty {
  padding: 60px;
  text-align: center;
  color: #666;
}


/* MOBILE */

@media(max-width: 800px) {

  .layout {
    grid-template-columns: 1fr;
  }

  .sidebar {
    display: none;
  }

  .main {
    padding: 20px;
  }

  .stats {
    grid-template-columns: 1fr;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .full {
    grid-column: auto;
  }

  .page-head {
    align-items: flex-start;
    flex-direction: column;
  }

}

</style>

</head>

<body>


<!-- LOGIN -->

<section id="loginScreen" class="login-screen">

  <div class="login-card">

    <div class="logo">
      ALGOFIT
    </div>

    <p class="muted">
      Store Administration
    </p>

    <form id="loginForm">

      <div class="field">

        <label>Email</label>

        <input
          id="loginEmail"
          type="email"
          required
          placeholder="admin@email.com"
        >

      </div>


      <div class="field">

        <label>Password</label>

        <input
          id="loginPassword"
          type="password"
          required
          placeholder="••••••••"
        >

      </div>


      <button class="primary">
        Login
      </button>

      <div id="loginError" class="error"></div>

    </form>

  </div>

</section>



<!-- ADMIN -->

<section id="adminScreen" class="admin hidden">

  <header class="topbar">

    <div class="brand">
      ALGOFIT / ADMIN
    </div>

    <button id="logoutBtn" class="logout">
      Logout
    </button>

  </header>


  <div class="layout">


    <aside class="sidebar">

      <button class="nav active">
        Products
      </button>

      <button class="nav">
        Orders
      </button>

      <button class="nav">
        Customers
      </button>

    </aside>


    <main class="main">

      <div class="page-head">

        <div>
          <h1>Products</h1>

          <p class="muted">
            Manage your AlgoFit catalogue
          </p>
        </div>

        <button id="addProductBtn" class="add-btn">
          + Add Product
        </button>

      </div>


      <div class="stats">

        <div class="stat">

          <small>Total Products</small>

          <strong id="totalProducts">
            0
          </strong>

        </div>

        <div class="stat">

          <small>Active</small>

          <strong id="activeProducts">
            0
          </strong>

        </div>

        <div class="stat">

          <small>Hidden</small>

          <strong id="hiddenProducts">
            0
          </strong>

        </div>

      </div>


      <div id="products" class="products"></div>

    </main>

  </div>

</section>



<!-- PRODUCT MODAL -->

<div id="productModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">

      <h2 id="modalTitle">
        Add Product
      </h2>

      <button id="closeModal" class="close">
        ×
      </button>

    </div>


    <form id="productForm">

      <input
        type="hidden"
        id="productId"
      >


      <div class="form-grid">


        <div class="field">

          <label>Product Name</label>

          <input
            id="productName"
            required
            placeholder="Oversized Black Hoodie"
          >

        </div>


        <div class="field">

          <label>Category</label>

          <select id="productCategory">

            <option>Hoodies</option>
            <option>Jeans</option>
            <option>T-Shirts</option>
            <option>Shirts</option>
            <option>Women</option>
            <option>Shoes</option>
            <option>Accessories</option>

          </select>

        </div>


        <div class="field">

          <label>Price (₹)</label>

          <input
            id="productPrice"
            type="number"
            min="0"
            required
            placeholder="999"
          >

        </div>


        <div class="field">

          <label>Sizes</label>

          <input
            id="productSizes"
            placeholder="S, M, L, XL"
          >

        </div>


        <div class="field full">

          <label>Image URL</label>

          <input
            id="productImage"
            type="url"
            required
            placeholder="https://..."
          >

        </div>


        <div class="field full">

          <label>Description</label>

          <textarea
            id="productDescription"
            rows="4"
            placeholder="Product description..."
          ></textarea>

        </div>


      </div>


      <label class="checkbox">

        <input
          id="productActive"
          type="checkbox"
          checked
        >

        Product visible on website

      </label>


      <button class="primary">
        Save Product
      </button>


      <div id="formError" class="error"></div>

    </form>

  </div>

</div>



<script>

let supabaseClient;
let session = null;
let products = [];
let editingId = null;

async function loginAdmin(event) {
  if (event) event.preventDefault();

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorBox = document.getElementById('loginError');

  errorBox.textContent = '';

  try {
    if (supabaseClient) {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (!error && data.session) {
        session = data.session;
        await verifyAdmin();
        return;
      }
    }
  } catch (e) {
    console.warn('Supabase login failed, trying local admin fallback:', e);
  }

  try {
    const fallback = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const fallbackData = await fallback.json();

    if (!fallback.ok) {
      errorBox.textContent = fallbackData.error || 'Invalid admin credentials.';
      return;
    }

    session = { access_token: fallbackData.token };
    await verifyAdmin();
  } catch (error) {
    console.error('Admin login request failed:', error);
    errorBox.textContent = 'Admin login needs the AlgoFit server. Open http://localhost:3000/admin.';
  }
}


// --------------------------------------------------
// INIT SUPABASE
// --------------------------------------------------

async function init() {

  try {
    const response = await fetch('/api/config');
    if (!response.ok) return;

    const config = await response.json();

    if (!config.supabaseUrl || !config.supabasePublishableKey) return;

    supabaseClient = window.supabase.createClient(
      config.supabaseUrl,
      config.supabasePublishableKey
    );

    const {
      data
    } = await supabaseClient.auth.getSession();

    if (data.session) {

      session = data.session;

      await verifyAdmin();

    }
  } catch (error) {
    console.warn('Admin server config unavailable:', error);
  }

}


// --------------------------------------------------
// LOGIN
// --------------------------------------------------

document
  .getElementById('loginForm')
  .addEventListener('submit', loginAdmin);


// --------------------------------------------------
// VERIFY ADMIN
// --------------------------------------------------

async function verifyAdmin() {

  const response = await fetch('/api/admin/me', {

    headers: {

      Authorization:
        `Bearer ${session.access_token}`

    }

  });

  const data = await response.json();

  if (!response.ok) {

    document
      .getElementById('loginError')
      .textContent =
      data.error || 'Admin access denied.';

    await supabaseClient.auth.signOut();

    return;

  }

  document
    .getElementById('loginScreen')
    .classList.add('hidden');

  document
    .getElementById('adminScreen')
    .classList.remove('hidden');

  await loadProducts();

}


// --------------------------------------------------
// LOAD PRODUCTS
// --------------------------------------------------

async function loadProducts() {

  const response = await fetch(
    '/api/admin/products',
    {
      headers: {
        Authorization:
          `Bearer ${session.access_token}`
      }
    }
  );

  const data = await response.json();

  if (!response.ok) {

    alert(data.error || 'Could not load products.');

    return;

  }

  products = data.products || [];

  renderProducts();

}


// --------------------------------------------------
// RENDER
// --------------------------------------------------

function renderProducts() {

  const root =
    document.getElementById('products');

  document
    .getElementById('totalProducts')
    .textContent = products.length;

  document
    .getElementById('activeProducts')
    .textContent =
    products.filter(p => p.is_active).length;

  document
    .getElementById('hiddenProducts')
    .textContent =
    products.filter(p => !p.is_active).length;


  if (!products.length) {

    root.innerHTML = `
      <div class="empty">
        No products yet.
      </div>
    `;

    return;

  }


  root.innerHTML = products.map(product => `

    <article class="product">

      <img
        class="product-image"
        src="${escapeHtml(product.image_url)}"
        alt="${escapeHtml(product.name)}"
      >

      <div class="product-body">

        <h3>
          ${escapeHtml(product.name)}
        </h3>

        <div class="product-price">
          ₹${Number(product.price).toLocaleString('en-IN')}
        </div>

        <div class="product-category">
          ${escapeHtml(product.category)}
          ·
          ${product.is_active ? 'Active' : 'Hidden'}
        </div>

        <div class="actions">

          <button
            onclick="editProduct('${product.id}')"
          >
            Edit
          </button>

          <button
            class="delete"
            onclick="deleteProduct('${product.id}')"
          >
            Delete
          </button>

        </div>

      </div>

    </article>

  `).join('');

}


// --------------------------------------------------
// ADD PRODUCT
// --------------------------------------------------

document
  .getElementById('addProductBtn')
  .addEventListener('click', () => {

    editingId = null;

    document
      .getElementById('modalTitle')
      .textContent = 'Add Product';

    document
      .getElementById('productForm')
      .reset();

    document
      .getElementById('productActive')
      .checked = true;

    document
      .getElementById('productModal')
      .classList.add('show');

  });


// --------------------------------------------------
// EDIT PRODUCT
// --------------------------------------------------

window.editProduct = function(id) {

  const product =
    products.find(p => p.id === id);

  if (!product) return;

  editingId = id;

  document
    .getElementById('modalTitle')
    .textContent = 'Edit Product';

  document
    .getElementById('productName')
    .value = product.name || '';

  document
    .getElementById('productCategory')
    .value = product.category || 'T-Shirts';

  document
    .getElementById('productPrice')
    .value = product.price || '';

  document
    .getElementById('productSizes')
    .value =
    Array.isArray(product.sizes)
      ? product.sizes.join(', ')
      : '';

  document
    .getElementById('productImage')
    .value =
    product.image_url || '';

  document
    .getElementById('productDescription')
    .value =
    product.description || '';

  document
    .getElementById('productActive')
    .checked =
    product.is_active !== false;

  document
    .getElementById('formError')
    .textContent = '';

  document
    .getElementById('productModal')
    .classList.add('show');

};


// --------------------------------------------------
// SAVE PRODUCT
// --------------------------------------------------

document
  .getElementById('productForm')
  .addEventListener('submit', async (event) => {

    event.preventDefault();

    const formError =
      document.getElementById('formError');

    formError.textContent = '';


    const product = {

      name:
        document.getElementById('productName').value.trim(),

      category:
        document.getElementById('productCategory').value,

      price:
        Number(
          document.getElementById('productPrice').value
        ),

      image_url:
        document.getElementById('productImage').value.trim(),

      description:
        document.getElementById('productDescription').value.trim(),

      sizes:
        document
          .getElementById('productSizes')
          .value
          .split(',')
          .map(x => x.trim())
          .filter(Boolean),

      is_active:
        document.getElementById('productActive').checked

    };


    const url = editingId
      ? `/api/admin/products/${editingId}`
      : '/api/admin/products';

    const method =
      editingId ? 'PUT' : 'POST';


    const response = await fetch(url, {

      method,

      headers: {

        'Content-Type': 'application/json',

        Authorization:
          `Bearer ${session.access_token}`

      },

      body: JSON.stringify(product)

    });


    const data = await response.json();


    if (!response.ok) {

      formError.textContent =
        data.error || 'Something went wrong.';

      return;

    }


    document
      .getElementById('productModal')
      .classList.remove('show');

    await loadProducts();

  });


// --------------------------------------------------
// DELETE
// --------------------------------------------------

window.deleteProduct = async function(id) {

  const product =
    products.find(p => p.id === id);

  if (!product) return;


  const confirmDelete =
    confirm(
      `Delete "${product.name}"?`
    );

  if (!confirmDelete) return;


  const response = await fetch(
    `/api/admin/products/${id}`,
    {

      method: 'DELETE',

      headers: {

        Authorization:
          `Bearer ${session.access_token}`

      }

    }
  );


  const data = await response.json();


  if (!response.ok) {

    alert(
      data.error ||
      'Could not delete product.'
    );

    return;

  }


  await loadProducts();

};


// --------------------------------------------------
// CLOSE MODAL
// --------------------------------------------------

document
  .getElementById('closeModal')
  .addEventListener('click', () => {

    document
      .getElementById('productModal')
      .classList.remove('show');

  });


// --------------------------------------------------
// LOGOUT
// --------------------------------------------------

document
  .getElementById('logoutBtn')
  .addEventListener('click', async () => {

    await supabaseClient.auth.signOut();

    location.reload();

  });


// --------------------------------------------------
// ESCAPE HTML
// --------------------------------------------------

function escapeHtml(value) {

  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');

}


init();

</script>

</body>
</html>
